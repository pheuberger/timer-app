<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ember — Candle Timer</title>
  <meta name="description" content="A calm candle timer. Light the candle, let it burn down." />
  <meta name="theme-color" content="#07060b" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ember" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="veil" aria-hidden="true"></div>

  <div id="ui">
    <header class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">EMBER</span>
    </header>

    <main class="panel">
      <div class="readout">
        <div id="status" class="status">Ready</div>
        <h1 id="time" class="time">05:00</h1>
      </div>

      <div class="rule" aria-hidden="true"></div>

      <div id="controls" class="controls">
        <div class="presets" id="presets"></div>

        <div class="custom">
          <div class="tools">
            <button class="custom-toggle" id="customToggle">Custom time</button>
            <span class="tools-sep" aria-hidden="true"></span>
            <button class="custom-toggle" id="editToggle">Edit presets</button>
            <span class="tools-sep only-editing" aria-hidden="true"></span>
            <button class="custom-toggle only-editing" id="restoreBtn">Restore defaults</button>
          </div>
          <div class="custom-fields" id="customFields" hidden>
            <div class="field">
              <input type="number" id="inH" min="0" max="9" value="0" inputmode="numeric" />
              <label>hrs</label>
            </div>
            <span class="colon">:</span>
            <div class="field">
              <input type="number" id="inM" min="0" max="59" value="5" inputmode="numeric" />
              <label>min</label>
            </div>
            <span class="colon">:</span>
            <div class="field">
              <input type="number" id="inS" min="0" max="59" value="0" inputmode="numeric" />
              <label>sec</label>
            </div>
          </div>
        </div>

        <div class="actions">
          <button id="startBtn" class="btn btn-primary">Light the candle</button>
          <button id="resetBtn" class="btn btn-ghost" hidden>Reset</button>
        </div>

        <!-- Preset editor: replaces the chip list while a preset is being
             created or edited -->
        <form id="editor" class="editor" hidden autocomplete="off">
          <div class="editor-title" id="editorTitle">New preset</div>
          <div class="icon-grid" id="iconGrid" role="radiogroup" aria-label="Icon"></div>
          <div class="field field-name">
            <input type="text" id="pName" maxlength="18" placeholder="Name" spellcheck="false" />
            <label for="pName">name</label>
          </div>
          <div class="custom-fields">
            <div class="field">
              <input type="number" id="pH" min="0" max="9" value="0" inputmode="numeric" />
              <label for="pH">hrs</label>
            </div>
            <span class="colon">:</span>
            <div class="field">
              <input type="number" id="pM" min="0" max="59" value="10" inputmode="numeric" />
              <label for="pM">min</label>
            </div>
            <span class="colon">:</span>
            <div class="field">
              <input type="number" id="pS" min="0" max="59" value="0" inputmode="numeric" />
              <label for="pS">sec</label>
            </div>
          </div>
          <div class="actions">
            <button type="submit" id="pSave" class="btn btn-primary">Save preset</button>
            <button type="button" id="pCancel" class="btn btn-ghost">Cancel</button>
            <button type="button" id="pDelete" class="custom-toggle danger" hidden>Delete</button>
          </div>
        </form>
      </div>

      <div id="done" class="done" hidden>
        <button id="doneReset" class="btn btn-primary">New timer</button>
      </div>
    </main>

    <div class="hint">Space — start · reset</div>
  </div>

  <div class="grain" aria-hidden="true"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js");
      });
    }
  </script>
</body>
</html>
